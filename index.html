<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шкатулка 2027</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--night:#0f1226;--plum:#2a1a3d;--cream:#f3e3c3;--rose:#e8a0b4;--ember:#ff9f68;--ink:#1b1530}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,var(--night) 0%,var(--plum) 60%,#4a2340 100%);color:var(--cream);font:16px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0)}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
section{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:56px 24px}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;line-height:1.05}
h1{font-size:clamp(46px,14vw,72px)}
h2{font-size:34px;margin-bottom:8px}
.sub{opacity:.75;margin-bottom:28px}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.count{display:flex;gap:10px;margin-top:36px}
.count div{flex:1;text-align:center;padding:14px 0;border:1px solid rgba(243,227,195,.25);border-radius:14px}
.count b{display:block;font:600 30px "Cormorant Garamond",serif}
.count span{font-size:12px;opacity:.7}
.hint{margin-top:28px;opacity:.6;font-size:14px}
.env-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.env{aspect-ratio:1.25;background:var(--cream);color:var(--ink);border:0;border-radius:6px;padding:12px;font:600 19px/1.15 "Cormorant Garamond",serif;font-style:italic;position:relative;cursor:pointer;text-align:left;display:flex;align-items:flex-end;overflow:hidden;transition:transform .2s}
.env:active{transform:scale(.96)}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.5%,rgba(27,21,48,.12) 50%) top/100% 55% no-repeat,linear-gradient(to bottom left,transparent 49.5%,rgba(27,21,48,.12) 50%) top/100% 55% no-repeat}
.env i{position:absolute;top:30%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#b3243e;box-shadow:0 0 0 3px rgba(179,36,62,.3)}
.env.read{opacity:.55}
.btn{background:var(--ember);color:var(--ink);border:0;border-radius:999px;padding:15px 28px;font:600 16px -apple-system,sans-serif;cursor:pointer}
.btn:active{transform:scale(.97)}
.oracle{margin-top:24px;min-height:96px;font:italic 500 26px/1.25 "Cormorant Garamond",serif;color:var(--rose)}
ul{list-style:none;padding:0}
li{padding:16px 0;border-bottom:1px solid rgba(243,227,195,.18);font:italic 500 23px/1.3 "Cormorant Garamond",serif}
.final{text-align:center;padding-bottom:110px}
#sheet{position:fixed;inset:0;z-index:5;background:rgba(10,8,22,.7);display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet article{width:100%;max-width:520px;margin:0 auto;background:var(--cream);color:var(--ink);border-radius:22px 22px 0 0;padding:30px 26px calc(30px + env(safe-area-inset-bottom,0));animation:up .35s ease-out}
#sheet h3{font:italic 600 28px "Cormorant Garamond",serif;margin-bottom:12px}
#sheet p{font-size:17px;white-space:pre-line}
#sheet .btn{margin-top:22px;background:var(--ink);color:var(--cream)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){#sheet article{animation:none}}
</style>
</head>
<body>
<canvas id="snow"></canvas>

<section class="hero">
  <h1 id="title"></h1>
  <p class="sub" id="lead" style="margin-top:18px"></p>
  <div class="count" id="count"></div>
  <p class="hint">Листай вниз. Здесь всё только для тебя.</p>
</section>

<section>
  <h2>Открой, когда…</h2>
  <p class="sub">Шесть писем на случай, когда меня нет рядом.</p>
  <div class="env-grid" id="envs"></div>
</section>

<section>
  <h2>Предсказание на 2027</h2>
  <p class="sub">Нажми и узнай, что тебя ждёт.</p>
  <button class="btn" id="oracleBtn">Вытянуть предсказание</button>
  <div class="oracle" id="oracle"></div>
</section>

<section>
  <h2>Мои обещания тебе</h2>
  <p class="sub">На весь следующий год.</p>
  <ul id="promises"></ul>
</section>

<section class="final">
  <h2>И последнее</h2>
  <p class="sub">Самое важное я оставил на конец.</p>
  <button class="btn" id="finalBtn">Открыть</button>
</section>

<div id="sheet"><article><h3 id="sh-t"></h3><p id="sh-p"></p><button class="btn" id="sh-x">Закрыть</button></article></div>

<script>
/* ============ ТУТ МЕНЯЕШЬ ВСЁ ЛИЧНОЕ ============ */
const CONFIG = {
  name: "Солнышко",
  lead: "Я сделал для тебя маленький мир. Он откроется по кусочку.",
  newYear: "2027-01-01T00:00:00",
  letters: [
    {t:"Грустно", p:"Напиши сюда своё письмо.\nМожно несколько строк."},
    {t:"Скучаешь", p:"Напиши сюда своё письмо."},
    {t:"Устала", p:"Напиши сюда своё письмо."},
    {t:"Сомневаешься в себе", p:"Напиши сюда своё письмо."},
    {t:"Хочется смеяться", p:"Напиши сюда своё письмо или нашу внутреннюю шутку."},
    {t:"Не спится", p:"Напиши сюда своё письмо."}
  ],
  oracles: [
    "В этом году ты скажешь «да» тому, чего раньше боялась.",
    "Тебя ждёт поездка, которую мы запомним надолго.",
    "Ты будешь смеяться так, что заболит живот. Минимум трижды.",
    "Кто-то очень близкий приготовит тебе завтрак. Не будем показывать пальцем.",
    "Твоя идея, которую ты откладывала, наконец сработает.",
    "Найдётся место, куда мы будем возвращаться снова и снова."
  ],
  promises: [
    "Обнимать тебя дольше, чем кажется нужным.",
    "Слушать, а не просто ждать своей очереди.",
    "Устраивать маленькие сюрпризы без повода.",
    "Говорить «я горжусь тобой» вслух.",
    "Возить тебя туда, куда ты давно хочешь."
  ],
  finalTitle: "Я тебя люблю",
  finalText: "Спасибо, что ты есть.\nС Новым годом, моя хорошая.\nПусть 2027 будет нашим."
};
/* ================================================ */

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#0f1226"); tg.setBackgroundColor && tg.setBackgroundColor("#0f1226"); }
const buzz = (t="light") => { try { tg.HapticFeedback.impactOccurred(t); } catch(e){} };
const $ = id => document.getElementById(id);

$("title").textContent = "С Новым годом, " + CONFIG.name;
$("lead").textContent = CONFIG.lead;
$("promises").innerHTML = CONFIG.promises.map(p => "<li></li>").join("");
[...$("promises").children].forEach((li,i) => li.textContent = CONFIG.promises[i]);

// Countdown
const cnt = $("count");
function tick(){
  let d = Math.max(0, new Date(CONFIG.newYear) - new Date()) / 1000;
  const v = [[Math.floor(d/86400),"дней"],[Math.floor(d%86400/3600),"часов"],[Math.floor(d%3600/60),"минут"],[Math.floor(d%60),"секунд"]];
  cnt.innerHTML = v.map(([n,l]) => `<div><b>${String(n).padStart(2,"0")}</b><span>${l}</span></div>`).join("");
}
tick(); setInterval(tick, 1000);

// Letters
const sheet = $("sheet");
CONFIG.letters.forEach((l, i) => {
  const b = document.createElement("button");
  b.className = "env"; b.innerHTML = "<i></i>"; b.append(l.t);
  b.onclick = () => {
    buzz(); b.classList.add("read");
    $("sh-t").textContent = "Когда " + l.t.toLowerCase(); $("sh-p").textContent = l.p;
    sheet.classList.add("on");
  };
  $("envs").append(b);
});
$("sh-x").onclick = () => sheet.classList.remove("on");
sheet.onclick = e => { if (e.target === sheet) sheet.classList.remove("on"); };

// Oracle
let last = -1;
$("oracleBtn").onclick = () => {
  let i; do { i = Math.floor(Math.random() * CONFIG.oracles.length); } while (i === last && CONFIG.oracles.length > 1);
  last = i; buzz("medium"); $("oracle").textContent = CONFIG.oracles[i];
  $("oracleBtn").textContent = "Ещё одно";
};

// Final: confetti + message
$("finalBtn").onclick = () => {
  buzz("heavy"); confetti();
  $("sh-t").textContent = CONFIG.finalTitle; $("sh-p").textContent = CONFIG.finalText;
  setTimeout(() => sheet.classList.add("on"), 600);
};

// Snow + confetti on one canvas
const cv = $("snow"), cx = cv.getContext("2d");
let W, H, flakes = [], bits = [];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener("resize", size); size();
for (let i = 0; i < (reduce ? 0 : 70); i++) flakes.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.6,s:Math.random()*.8+.3,d:Math.random()*Math.PI*2});
function confetti(){
  const cols = ["#ff9f68","#e8a0b4","#f3e3c3","#b3243e","#ffffff"];
  for (let i = 0; i < 160; i++) bits.push({x:W/2,y:H*.6,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,w:Math.random()*7+4,c:cols[i%5],a:Math.random()*6});
}
(function loop(){
  cx.clearRect(0,0,W,H);
  cx.fillStyle = "rgba(243,227,195,.8)";
  flakes.forEach(f => { f.y += f.s; f.d += .01; f.x += Math.sin(f.d)*.4; if (f.y > H) { f.y = -5; f.x = Math.random()*W; } cx.beginPath(); cx.arc(f.x,f.y,f.r,0,7); cx.fill(); });
  bits = bits.filter(b => b.y < H + 20);
  bits.forEach(b => { b.vy += .35; b.x += b.vx; b.y += b.vy; b.a += .2; cx.fillStyle = b.c; cx.save(); cx.translate(b.x,b.y); cx.rotate(b.a); cx.fillRect(-b.w/2,-b.w/4,b.w,b.w/2); cx.restore(); });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
